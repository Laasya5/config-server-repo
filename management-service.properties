server.port=8091

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/admin/clinic_management

# IMPORTANT: Disable JPA explicitly
spring.jpa.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# ---------------- KAFKA (CONSUMER ONLY) ----------------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=management-service
spring.kafka.consumer.auto-offset-reset=earliest

# Use ErrorHandlingDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# Delegate actual JSON deserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

# Tell it which class to convert into
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.management_service.event.AppointmentEvent

spring.kafka.consumer.properties.spring.json.trusted.packages=*


# ---------------- EUREKA ----------------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

